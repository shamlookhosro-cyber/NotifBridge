name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NotifBridge.apk
          gh release create "build-${{ github.run_number }}" NotifBridge.apk --title "NotifBridge build ${{ github.run_number }}" --notes "APK"
